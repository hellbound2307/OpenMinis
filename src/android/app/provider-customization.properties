# provider-customization.properties (Minis X fork)
#
# Build-time customization consumed by app/build.gradle.kts → BuildConfig.
# Upstream ships this file only in their private repo; the public mirror has
# only the empty .example. This fork ships real values so the OAuth features
# work out of the box.

# System prompt prefix required by Anthropic for Claude Code OAuth requests
# ("This credential is only authorized for use with Claude Code"). This is the
# identifying line Claude Code itself sends; other open-source projects
# talking to the same endpoint declare the same identifier, e.g.
# https://github.com/Wei-Shaw/claude-relay-service
ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=You are Claude Code, Anthropic's official CLI for Claude.

# Google (Gemini) OAuth client — empty = the public Gemini CLI installed-app
# client (same as upstream default).
GOOGLE_OAUTH_CLIENT_ID=
GOOGLE_OAUTH_CLIENT_SECRET=
